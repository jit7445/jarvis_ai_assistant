[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "Local voice assistant service for macOS on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "sounddevice==0.5.6",
    "uvicorn==0.54.0",
    "pyobjc-framework-ApplicationServices==13.0",
    "pyobjc-framework-Cocoa==13.0",
    "pyobjc-framework-CoreMedia==13.0",
    "pyobjc-framework-Quartz==13.0",
    "pyobjc-framework-ScreenCaptureKit==13.0",
]

[project.scripts]
jarvis = "jarvis.app:main"

[project.optional-dependencies]
dev = [
    "cmake==4.4.4",
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
