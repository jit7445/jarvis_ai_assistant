[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "Local voice assistant service for macOS on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = [
    "cmake==4.4.4",
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
